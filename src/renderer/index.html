<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Panel de Control Bitget</title>
    <!--
      Politica de contenido estricta: sin CDN, sin fuentes remotas, sin conexiones
      salvo a la API de Bitget desde el proceso principal (el renderer no habla
      con la red). docs/01-stack-tecnologico.md seccion 7.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self' ws://localhost:* http://localhost:*;
               object-src 'none';
               base-uri 'none';
               form-action 'none';
               frame-ancestors 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
