appId: mx.pcb.panel
productName: Panel de Control Bitget
copyright: Copyright (c) 2026

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true

win:
  # Ejecutable portable: abrir y usar, sin instalador con asistente.
  # Alcance contratado, presupuesto seccion 2 punto 4.
  target:
    - target: portable
      arch: [x64]
  # El entorno va en el nombre del archivo, no solo en la version.
  #
  # Este config empaqueta el modo `production`, que electron.vite.config.ts
  # mapea al entorno `dev`: datos de demostracion. Sin el sufijo, el .exe de
  # demostracion y el del cliente salian con el mismo nombre y el ultimo en
  # construirse borraba al otro, sin que nada en el archivo dijera cual era
  # cual. El binario del cliente lo produce electron-builder.staging.yml.
  artifactName: PCB-${version}-demo-portable.exe

portable:
  # El .exe se descomprime en una carpeta fija en lugar de una temporal
  # aleatoria, para que PORTABLE_EXECUTABLE_DIR sea estable entre arranques
  # y la carpeta datos/ acompañe siempre al ejecutable.
  unpackDirName: PCB
  requestExecutionLevel: user

compression: maximum
